name: Fnf v slice mobile

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6
          
      - uses: actions/cache@v4
        with:
          path: ~/.haxelib
          key: ${{ runner.os }}-haxelib-${{ github.sha }}
          restore-keys: ${{ runner.os }}-haxelib-
          
      - uses: android-actions/setup-android@v3

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Install Haxe Libraries
        run: |
          mkdir -p ~/.haxelib
          haxelib setup ~/.haxelib
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install hxcpp --quiet
          haxelib run lime setup flixel
          haxelib remove flixel-addons --quiet
          haxelib run lime setup
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_ROOT
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          haxelib install flixel-tools --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-addons --quiet
          haxelib install hscript --quiet
          haxelib install hxCodec --quiet
          haxelib install newgrounds --quiet
          haxelib git faxe https://github.com/uhrobots/faxe --quiet
          haxelib git polymod https://github.com/larsiusprime/polymod.git --quiet
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc --quiet
          haxelib git extension-webm https://github.com/luckydog7/extension-webm --quiet
          haxelib git linc_luajit https://github.com/MasterEric/linc_luajit.git --quiet
          haxelib git hxvm-luajit https://github.com/nebulazorua/hxvm-luajit.git --quiet
          haxelib install actuate --quiet
          haxelib list

      - name: Build APK
        run: haxelib run lime build android -final
        timeout-minutes: 180

      - uses: actions/upload-artifact@v4
        with:
          name: FNF-VSLICE-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          retention-days: 90        with:
          ndk-version: r27c

      - name: Install Haxe Libraries
        run: |
          mkdir -p ~/.haxelib
          haxelib setup ~/.haxelib
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install hxcpp --quiet
          haxelib run lime setup flixel
          haxelib remove flixel-addons --quiet
          haxelib run lime setup
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_ROOT
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          haxelib install flixel-tools --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-addons --quiet
          haxelib install hscript --quiet
          haxelib install hxCodec --quiet
          haxelib install newgrounds --quiet
          haxelib git faxe https://github.com/uhrobots/faxe --quiet
          haxelib git polymod https://github.com/larsiusprime/polymod.git --quiet
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc --quiet
          haxelib git extension-webm https://github.com/luckydog7/extension-webm --quiet
          haxelib git linc_luajit https://github.com/MasterEric/linc_luajit.git --quiet
          haxelib git hxvm-luajit https://github.com/nebulazorua/hxvm-luajit.git --quiet
          haxelib install actuate --quiet
          haxelib list
          
      - name: Build APK
        run: haxelib run lime build android -final
        timeout-minutes: 180
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-VSLICE-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          retention-days: 90          java-version: '11'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Setup Haxelib and Dependencies
        run: |
          mkdir -p ~/.haxelib
          haxelib setup ~/.haxelib
          haxelib install lime --quiet
          haxelib install openfl --quiet
          haxelib install flixel --quiet
          haxelib install hxcpp --quiet
          haxelib run lime setup flixel
          haxelib remove flixel-addons --quiet
          haxelib run lime setup
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_ROOT
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
          haxelib install flixel-tools --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-addons --quiet
          haxelib install hscript --quiet
          haxelib install hxCodec --quiet
          haxelib install newgrounds --quiet
          haxelib git faxe https://github.com/uhrobots/faxe --quiet
          haxelib git polymod https://github.com/larsiusprime/polymod.git --quiet
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc --quiet
          haxelib git extension-webm https://github.com/luckydog7/extension-webm --quiet
          haxelib git linc_luajit https://github.com/MasterEric/linc_luajit.git --quiet
          haxelib git hxvm-luajit https://github.com/nebulazorua/hxvm-luajit.git --quiet
          haxelib install actuate --quiet
          haxelib list

      - name: Build APK
        run: haxelib run lime build android -final
        timeout-minutes: 180

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FNF-VSLICE-Android-APK
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 90
