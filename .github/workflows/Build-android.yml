name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          java-package: 'jdk'
          cache: 'gradle'
          check-latest: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDKs
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "build-tools;33.0.0"
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-31"
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.0

      - name: Create haxelib directory
        run: |
          mkdir -p ~/.haxelib
          haxelib newrepo

      - name: Install Haxe dependencies
        run: |
          haxelib install hmm
          haxelib run hmm install -q
          cd .haxelib/hxcpp/git/tools/hxcpp && haxe compile.hxml || true

      - name: Configure build environment
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          export ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT/ndk/25.2.9519653
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Build APK Release
        run: |
          haxelib run lime build android -v -release
        timeout-minutes: 180

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FNF-Mobile-APK
          path: export/release/android/bin/app-release.apk
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: false

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: export/release/android/bin/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN
