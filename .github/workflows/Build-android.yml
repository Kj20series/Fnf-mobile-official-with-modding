name: Mobile

on:
  workflow_dispatch:
    inputs:
      buildFlags:
        required: false
        type: string
  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string

env:
  PROJECT_NAME: FNF-VSLICE

jobs:
  Mobile:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'main'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        if: startsWith(matrix.os, 'ubuntu')
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Restore cache
        uses: actions/cache@v4
        with:
          key: cache-build-${{ matrix.os }}-${{ github.sha }}
          path: |
            ~/.gradle
            .haxelib/
            /home/runner/haxelib/
            /Users/runner/haxelib/
            ~/.haxelib/
            export/release/android/haxe/
            export/release/android/obj/
            export/release/ios/haxe/
            export/release/ios/obj/
          restore-keys: |
            cache-build-${{ matrix.os }}

      - name: Install Libraries
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install --quiet

      - name: Configure Android
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT ${{ steps.setup-ndk.outputs.ndk-path }}
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Compile (Android)
        if: startsWith(matrix.os, 'ubuntu')
        run: haxelib run lime build android -final -ONLY_ARM64 ${{ inputs.buildFlags }}
        timeout-minutes: 180

      - name: Compile (iOS)
        if: startsWith(matrix.os, 'macos')
        run: haxelib run lime build ios -nosign ${{ inputs.buildFlags }}
        timeout-minutes: 180

      - name: Make IPA
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/${{ env.PROJECT_NAME }}.app
          ldid -S../../../${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.entitlements ${{ env.PROJECT_NAME }}
          cd ..
          mkdir Payload
          mv ${{ env.PROJECT_NAME }}.app Payload
          zip -r ${{ env.PROJECT_NAME }}.ipa Payload

      - name: Upload Artifact (Android)
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: FNF-VSLICE-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Upload Artifact (iOS)
        if: startsWith(matrix.os, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: FNF-VSLICE-iOS
          path: export/release/ios/build/Release-iphoneos/${{ env.PROJECT_NAME }}.ipa
          if-no-files-found: warn
          retention-days: 90

      - name: Clear Old Cache
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            })
            for (const cache of caches.data.actions_caches) {
              if (cache.key.startsWith("cache-build-${{ matrix.os }}")) {
                console.log('Clearing ' + cache.key)
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                })
              }
            }

      - name: Upload new cache
        uses: actions/cache@v4
        with:
          key: cache-build-${{ matrix.os }}-${{ github.sha }}
          path: |
            ~/.gradle
            .haxelib/
            /home/runner/haxelib/
            /Users/runner/haxelib/
            ~/.haxelib/
            export/release/android/haxe/
            export/release/android/obj/
            export/release/ios/haxe/
            export/release/ios/obj/
          restore-keys: |
            cache-build-${{ matrix.os }}
