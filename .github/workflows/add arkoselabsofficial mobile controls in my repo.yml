name: Import Mobile Controls

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Clone and copy mobile controls
        run: |
          git clone https://github.com/ArkoseLabsOfficial/mobile-controls-dev.git mobile-controls-tmp
          rm -rf mobile-controls-tmp/.git
          cp -r mobile-controls-tmp/. ./
          rm -rf mobile-controls-tmp

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        run: |
          git add .
          git diff --staged --quiet || git commit -m "Import mobile controls from ArkoseLabsOfficial"
          git push origin main
