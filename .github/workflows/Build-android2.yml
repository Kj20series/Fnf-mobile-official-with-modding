name: Build Android APK (Stable Release)

on:
  workflow_dispatch:
    inputs:
      build-defines:
        type: string
        description: Build defines to use
        default: '-DGITHUB_BUILD'
      save-artifact:
        type: boolean
        description: Save the build artifact to Github Actions
        default: true
  push:
    branches:
      - main
      - master
      - develop

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.0

      - name: Setup Haxelib
        run: |
          haxelib newrepo
          haxelib install hmm
          haxelib run hmm install -q

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: '34'
          build-tools-version: '34.0.0'
          ndk-version: '26.1.10909125'
          cache: true

      - name: Configure Android SDK environment
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          export ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV

      - name: Populate .env
        run: |
          touch .env
          echo "HAXE_ANDROID_API=34" >> .env

      - name: Build APK (Release)
        env:
          BUILD_DEFINES: ${{ github.event.inputs.build-defines || '-DGITHUB_BUILD' }}
        run: |
          haxelib run lime build android -v -release $BUILD_DEFINES -DAPP_VERSION="${{ github.ref_name }}"
        timeout-minutes: 120

      - name: List build outputs
        run: |
          find export/release/android -type f -name "*.apk" 2>/dev/null || echo "No APK found"
          ls -lah export/release/android/bin/ 2>/dev/null || echo "No bin directory"

      - name: Upload APK artifact
        if: ${{ github.event.inputs.save-artifact != false }}
        uses: actions/upload-artifact@v4
        with:
          name: fnf-android-release-${{ github.run_number }}
          path: export/release/android/bin/*.apk
          retention-days: 90
          if-no-files-found: warn

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: export/release/android/bin/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to itch.io (optional)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ ! -z "$BUTLER_API_KEY" ]; then
            echo "Butler API key found, uploading to itch.io"
            # Add your itch.io upload command here if needed
          else
            echo "No Butler API key configured"
