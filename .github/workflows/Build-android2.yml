name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build-defines:
        type: string
        description: Build defines to use
        default: '-DGITHUB_BUILD'
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.0

      - name: Install Haxelib dependencies
        run: |
          haxelib install hmm
          haxelib run hmm install

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: '31,34'
          build-tools-version: '34.0.0'
          ndk-version: '25.2.9519653'
          cache: true

      - name: Configure Android environment
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT
          export ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV

      - name: Build APK
        env:
          BUILD_DEFINES: ${{ github.event.inputs.build-defines || '-DGITHUB_BUILD' }}
        run: |
          haxelib run lime build android -v -release $BUILD_DEFINES
        timeout-minutes: 180

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: fnf-android-build-${{ github.run_number }}
          path: export/release/android/bin/*.apk
          retention-days: 90

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/') && success()
        uses: softprops/action-gh-release@v1
        with:
          files: export/release/android/bin/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "Android APK build failed. Check the logs above for details."
          exit 1      - name: Upload to itch.io (optional)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [ ! -z "$BUTLER_API_KEY" ]; then
            echo "Butler API key found, uploading to itch.io"
            # Add your itch.io upload command here if needed
          else
            echo "No Butler API key configured"
