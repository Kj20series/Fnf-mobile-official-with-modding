name: Sync with FNF Upstream

on:
  # Run automatically every day at midnight to catch new releases
  schedule:
    - cron: '0 0 * * *'
  # Also allow manual trigger
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          # Use a PAT so the workflow can push back to your repo
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add FNF upstream remote
        run: git remote add upstream https://github.com/FunkinCrew/Funkin.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream main into your main
        run: |
          git checkout main
          # --no-edit accepts the default merge commit message automatically
          git merge upstream/main --no-edit --strategy-option=theirs

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Push to your repo
        run: git push origin main
