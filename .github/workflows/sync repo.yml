name: Sync with FNF Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add FNF upstream remote
        run: git remote add upstream https://github.com/FunkinCrew/Funkin.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Merge upstream main into actions branch
        run: |
          # Create the actions branch if it doesn't exist yet
          git checkout actions 2>/dev/null || git checkout -b actions
          git merge upstream/main --no-edit --allow-unrelated-histories --strategy-option=theirs

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Push to actions branch
        run: git push origin actions
