name: Sync with FNF Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Clone FNF upstream
        run: git clone https://github.com/FunkinCrew/Funkin.git upstream-tmp

      - name: Copy upstream files into your repo
        run: |
          # Backup your mobile files before copying
          if [ -d "assets/mobile" ]; then
            cp -r assets/mobile /tmp/mobile-assets-backup
          fi
          if [ -d "source/mobile" ]; then
            cp -r source/mobile /tmp/mobile-source-backup
          fi

          # Remove upstream's git history and their workflow files
          rm -rf upstream-tmp/.git
          rm -rf upstream-tmp/.github/workflows/

          # Copy everything from upstream into your repo
          cp -r upstream-tmp/. ./
          rm -rf upstream-tmp

          # Restore your mobile files
          if [ -d "/tmp/mobile-assets-backup" ]; then
            mkdir -p assets/mobile
            cp -r /tmp/mobile-assets-backup/. assets/mobile/
          fi
          if [ -d "/tmp/mobile-source-backup" ]; then
            mkdir -p source/mobile
            cp -r /tmp/mobile-source-backup/. source/mobile/
          fi

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        run: |
          git add .
          git diff --staged --quiet || git commit -m "Sync with FunkinCrew upstream"
          git push origin main
