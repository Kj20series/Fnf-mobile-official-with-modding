name: Sync with FNF Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add FNF upstream remote
        run: git remote add upstream https://github.com/FunkinCrew/Funkin.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Force overwrite with upstream files
        run: |
          # Reset to upstream's main — their files completely replace yours
          # Your .github/workflows/ folder is preserved below
          git checkout main
          git reset --hard upstream/main

          # Restore YOUR workflow files so they don't get overwritten
          git checkout HEAD@{1} -- .github/workflows/

      - name: Update submodules
        run: git submodule update --init --recursive

      - name: Push to main
        run: git push origin main --force
