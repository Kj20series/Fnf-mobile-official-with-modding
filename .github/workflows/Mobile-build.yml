name: V-Slice Mobile (2026 Bulletproof Build)
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Clones the funkin.assets PC folder

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Neko & Haxe (Manual Path Fix)
        run: |
          # 1. Install Neko first (Haxelib requires this to run)
          sudo apt-get update && sudo apt-get install -y neko
          
          # 2. Download and Extract Haxe 4.3.7
          wget https://github.com/HaxeFoundation/haxe/releases/download/4.3.7/haxe-4.3.7-linux64.tar.gz
          mkdir -p ~/haxe-dist
          tar -xf haxe-4.3.7-linux64.tar.gz -C ~/haxe-dist
          
          # 3. Find the exact folder and set paths (Auto-Detection)
          HAXE_DIR=$(find ~/haxe-dist -maxdepth 1 -type d -name "haxe-*" | head -n 1)
          echo "Haxe found at: $HAXE_DIR"
          chmod +x $HAXE_DIR/haxe $HAXE_DIR/haxelib
          echo "$HAXE_DIR" >> $GITHUB_PATH
          echo "HAXEPATH=$HAXE_DIR" >> $GITHUB_ENV
          
      - name: Install Global Libraries
        run: |
          # Use absolute path for the very first setup
          $HAXEPATH/haxelib setup ~/haxelib
          
          # Core Frameworks (Stable Versions for V-Slice)
          haxelib install lime 8.1.2
          haxelib install openfl 9.3.3
          haxelib install flixel 5.5.0
          haxelib run lime setup flixel
          haxelib run lime setup
          
          # V-Slice / PC Dependencies
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install flixel-tools
          haxelib install hscript-iris
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis.git
          
          # Verified Mobile Forks (GrowtopiaFli = renderedFrames Fix)
          haxelib git extension-webm https://github.com/GrowtopiaFli/extension-webm
          haxelib git hxvlc https://github.com/MAJigsaw77/hxvlc.git
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools.git
          
          haxelib upgrade -y

      - name: Setup Android NDK (r25c)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Configure Lime for Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Rebuild Extensions
        run: |
          # Compiles the C++ code specifically for Android
          haxelib run lime rebuild extension-webm android
          haxelib run lime rebuild hxvlc android

      - name: Build Final APK
        run: |
          # Removed the colon (:) from the title to prevent artifact errors
          haxelib run lime build android -final \
          -DAPP_TITLE="Friday Night Funkin Vslice mobile" \
          -DAPP_PACKAGE="com.Funkin.Mobile"

      - name: Rename & Upload APK
        run: |
          # Finds the APK and renames it to something simple for the artifact
          mv export/release/android/bin/app/build/outputs/apk/release/*.apk funkin_vslice_mobile.apk
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSlice-Mobile-Final
          path: funkin_vslice_mobile.apk
