name: Build FNF VSlice Mobile APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "build-tools;34.0.0" \
                      "platforms;android-34" \
                      "platform-tools" \
                      "ndk;27.2.12479018"

      - name: Install Linux system dependencies (comprehensive for Lime rebuild)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            g++-multilib gcc-multilib \
            libasound2-dev \
            libpulse-dev \
            libdbus-1-dev \
            libudev-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libxv-dev \
            libxxf86vm-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libibus-1.0-dev \
            libsndio-dev \
            libdrm-dev \
            libgbm-dev \
            pkg-config \
            libopenal-dev \
            libpulse0 \
            libasound2-plugins \
            libfreetype6-dev \
            libfontconfig1-dev \
            libgtk-3-dev \
            libssl-dev \
            libcurl4-openssl-dev \
            libpng-dev \
            libjpeg-dev \
            libtiff-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libvorbis-dev \
            libogg-dev \
            libflac-dev \
            libmp3lame-dev \
            libharfbuzz-dev \
            libfreetype-dev

      - name: Set Android Environment Variables
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Setup HMM
        run: |
          haxelib --global git haxelib https://github.com/FunkinCrew/haxelib.git
          haxelib --global git hmm https://github.com/FunkinCrew/hmm.git
          haxelib run hmm setup

      - name: Install Mobile Controls
        run: haxelib install mobile-controls 1.0.0

      - name: Install hxp from git
        run: haxelib --global git hxp https://github.com/openfl/hxp.git

      - name: Install dependencies
        run: haxelib run hmm install

      - name: Bootstrap hxcpp
        run: |
          HXCPP_PATH=$(haxelib libpath hxcpp)
          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Setup Lime Config
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime setup android

      - name: Rebuild Lime
        run: |
          haxelib run lime rebuild lime linux
          haxelib run lime rebuild lime android

      - name: Patch project.hxp with mobile source path
        run: |
          sed -i 's|this.sources.push(SOURCE_DIR);|this.sources.push(SOURCE_DIR);\n    this.sources.push("source\/mobile");|' project.hxp

      - name: Clean build
        run: haxelib run lime clean android

      - name: Build APK (PC-like version)
        run: |
          haxelib run lime build android -final -ONLY_ARM64 \
            -DNO_FEATURE_TOUCH_CONTROLS \
            -DNO_FEATURE_HAPTICS \
            -DNO_FEATURE_MOBILE_ADVERTISEMENTS \
            -DNO_FEATURE_MOBILE_IAP \
            -DNO_FEATURE_MOBILE_IAR \
            -DNO_FEATURE_GHOST_TAPPING \
            -DNO_FEATURE_COMPRESSED_TEXTURES \
            -DNO_CENSOR_EXPLETIVES \
            -DFEATURE_DEBUG_FUNCTIONS \
            -DFEATURE_DEBUG_MENU \
            -DFEATURE_ANIMATION_EDITOR \
            -DFEATURE_CHART_EDITOR \
            -DFEATURE_STAGE_EDITOR \
            -DFEATURE_FILE_DROP \
            -DFEATURE_SCREENSHOTS \
            -DFEATURE_LOST_FOCUS_VOLUME \
            -DGITHUB_BUILD \
            --cpp-flag=-Wno-dangling-reference \
            --cpp-flag=-Wno-error=dangling-reference \
            --cpp-flag=-w

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-VSlice-AdFree-Debug
          path: export/release/android/bin/app/build/outputs/apk/debug
