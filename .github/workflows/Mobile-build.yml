name: Build FNF VSlice Mobile APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Using the specific stable build version for NDK r25b
      NDK_VERSION: 25.2.9519653

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y neko libasound2-dev libpulse-dev libx11-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev libglu1-mesa-dev g++-multilib gcc-multilib

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set Android Environment Variables
        run: |
          # Use the pre-installed SDK and NDK on the runner to avoid 404 downloads
          ANDROID_SDK=$ANDROID_SDK_ROOT
          ANDROID_NDK=$ANDROID_SDK/ndk/${{ env.NDK_VERSION }}
          
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          
          # Add tools to path
          echo "$ANDROID_SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK/platform-tools" >> $GITHUB_PATH

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Setup HMM
        run: |
          haxelib --global git haxelib https://github.com/FunkinCrew/haxelib.git
          haxelib --global git hmm https://github.com/FunkinCrew/hmm.git
          haxelib run hmm setup
          haxelib run hmm install

      - name: Bootstrap hxcpp
        run: |
          HXCPP_PATH=$(haxelib libpath hxcpp)
          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Setup Lime Config
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          # Rebuild Lime for the host (Linux) and the target (Android)
          haxelib run lime rebuild lime linux
          haxelib run lime rebuild lime android

      - name: Clean build
        run: haxelib run lime clean android

      - name: Build APK
        # -debug for testing, -Dci to disable interactive prompts
        run: haxelib run lime build android -debug -Dci

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-VSlice-AdFree-Debug
          path: export/release/android/bin/app/build/outputs/apk/debug/*.apk
