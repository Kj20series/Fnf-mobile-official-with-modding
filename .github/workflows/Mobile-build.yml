name: Build FNF VSlice Mobile APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 25.2.9519653

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            neko \
            g++-multilib gcc-multilib \
            libasound2-dev \
            libpulse-dev \
            libdbus-1-dev \
            libudev-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libxss-dev \
            libxv-dev \
            libxxf86vm-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libibus-1.0-dev \
            libsndio-dev \
            libdrm-dev \
            libgbm-dev \
            pkg-config
          # Optional packages
          sudo apt-get install -y \
            libwayland-egl-backend-dev \
            fcitx-libs-dev \
            libmirclient-dev || true
          # Fix DBus arch-deps header path — SDL looks in /usr/include/dbus-1.0/dbus/
          # but Ubuntu installs it under /usr/lib/.../dbus-1.0/include/dbus/
          DBUS_ARCH=$(find /usr/lib -name "dbus-arch-deps.h" 2>/dev/null | head -1)
          if [ -n "$DBUS_ARCH" ]; then
            sudo ln -sf "$DBUS_ARCH" /usr/include/dbus-1.0/dbus/dbus-arch-deps.h
          fi
          # Fix sndio header path if needed
          SNDIO_H=$(find /usr/include -name "sndio.h" 2>/dev/null | head -1)
          if [ -z "$SNDIO_H" ]; then
            sudo find /usr -name "sndio.h" 2>/dev/null -exec ln -sf {} /usr/include/sndio.h \;
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set Android Environment Variables
        run: |
          ANDROID_SDK=$ANDROID_SDK_ROOT
          ANDROID_NDK=$ANDROID_SDK/ndk/${{ env.NDK_VERSION }}
          echo "ANDROID_HOME=$ANDROID_SDK"       >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK"   >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK"   >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK"   >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME"             >> $GITHUB_ENV
          echo "$ANDROID_SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK/platform-tools"           >> $GITHUB_PATH

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools" "ndk;25.2.9519653"

      - name: Setup HMM
        run: |
          haxelib --global git haxelib https://github.com/FunkinCrew/haxelib.git
          haxelib --global git hmm https://github.com/FunkinCrew/hmm.git
          haxelib run hmm setup

      - name: Install Mobile Controls
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        run: haxelib install mobile-controls 1.0.0

      # Install hxp directly from git to avoid haxelib server 502 errors
      - name: Install hxp from git
        run: haxelib --global git hxp https://github.com/openfl/hxp.git

      - name: Install dependencies
        run: haxelib run hmm install

      - name: Cache Lime rebuild
        uses: actions/cache@v4
        id: lime-cache
        with:
          path: |
            ~/.haxelib/lime
            ~/.haxelib/hxcpp
          key: lime-rebuild-${{ runner.os }}-${{ hashFiles('hmm.json') }}
          restore-keys: |
            lime-rebuild-${{ runner.os }}-

      - name: Bootstrap hxcpp
        run: |
          HXCPP_PATH=$(haxelib libpath hxcpp)
          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Setup Lime Config
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime setup android

      - name: Rebuild Lime (skipped if cached)
        if: steps.lime-cache.outputs.cache-hit != 'true'
        run: |
          haxelib run lime rebuild lime linux
          haxelib run lime rebuild lime android

      - name: Patch project.hxp with mobile source path
        run: |
          sed -i 's|this.sources.push(SOURCE_DIR);|this.sources.push(SOURCE_DIR);\n    this.sources.push("source\/mobile");|' project.hxp

      - name: Clean build
        run: haxelib run lime clean android

      - name: Build APK
        run: haxelib run lime build android -final -DONLY_ARM64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-VSlice-AdFree-Debug
          path: export/final/android/bin/app/build/outputs/apk/release/*.apk
