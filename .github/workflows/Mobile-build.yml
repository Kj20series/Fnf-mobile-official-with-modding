name: V-Slice Mobile Build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libusb-1.0-0-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Setup Java & Haxe
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Haxe
        uses: FunkinCrew/ci-haxe@v3
        with:
          haxe-version: 4.3.7

      - name: Install Haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.1.2 --never
          haxelib install openfl 9.3.3 --never
          # Using the Funkin' Crew's specific flixel branch for PartialSound support
          haxelib git flixel https://github.com/FunkinCrew/flixel.git --never
          haxelib install flixel-addons --never
          haxelib install flixel-ui --never
          haxelib install hxp --never
          # Pulling the 'dev' branch of flxanimate which contains the missing internal types
          haxelib git flxanimate https://github.com/Dot-Stuff/flxanimate.git dev --never
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis.git --never
          haxelib git hxvlc https://github.com/MAJigsaw77/hxvlc.git --never
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools.git --never
          haxelib install hscript-iris --never
          haxelib install polymod --never
          haxelib install thx.core --never
          haxelib git grig.audio https://gitlab.com/grig-io/grig.audio.git --never

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Final Build
        run: |
          PROJECT_FILE=$(find . -maxdepth 2 -iname "project.xml" -print -quit)
          if [ -z "$PROJECT_FILE" ]; then exit 1; fi
          haxelib run lime build "$PROJECT_FILE" android -final -64 -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VSlice-Mobile-Modded
          path: export/android/bin/app/build/outputs/apk/release/*.apk
