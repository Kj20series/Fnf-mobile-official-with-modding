name: V-Slice Mobile (Modern Build)
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Keeps the PC structure for downloading assets

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Latest stable standard for modern Android Gradle builds

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 'latest' # Forces the absolute latest Haxe version

      - name: Install HMM and PC Dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install hmm
          haxelib run hmm setup
          haxelib run hmm install # Pulls all dependencies from the PC hmm.json
          
          # Force the specific webm fork for audio sync
          haxelib git extension-webm https://github.com/KlavierGayming/extension-webm
          haxelib upgrade -y

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c # Modern, stable NDK for latest Android targets

      - name: Configure Lime for Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Rebuild Extension Webm (Android Target)
        run: haxelib run lime rebuild extension-webm android

      - name: Compile APK
        run: |
          haxelib run lime build android -final \
          -DAPP_TITLE="Friday Night Funkin': Vslice mobile" \
          -DAPP_PACKAGE="com.Funkin.Mobile"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSlice-Mobile-Latest
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
