name: V-Slice Mobile (hxcpp Tool Fix)
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libusb-1.0-0-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: FunkinCrew/ci-haxe@v3
        with:
          haxe-version: 4.3.7

      - name: Install & Compile hxcpp (The Fix)
        run: |
          haxelib setup ~/haxelib
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp.git
          # Move into the hxcpp tool directory and compile the missing .n file
          cd ~/haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml
          # Return to root
          cd ${{ github.workspace }}

      - name: Install Global Libraries
        run: |
          haxelib install lime 8.1.2
          haxelib install openfl 9.3.3
          haxelib install flixel 5.5.0
          haxelib run lime setup flixel
          haxelib run lime setup
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install hscript-iris
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis.git
          haxelib git extension-webm https://github.com/GrowtopiaFli/extension-webm
          haxelib git hxvlc https://github.com/MAJigsaw77/hxvlc.git
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools.git
          haxelib upgrade -y

      - name: Setup Android NDK (r25c)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Rebuild & Build APK
        run: |
          haxelib run lime rebuild extension-webm android
          haxelib run lime rebuild hxvlc android
          haxelib run lime build android -final \
          -DAPP_TITLE="Friday Night Funkin Vslice mobile" \
          -DAPP_PACKAGE="com.Funkin.Mobile"

      - name: Rename & Upload APK
        run: |
          find export/release/android/bin/app/build/outputs/apk/release/ -name "*.apk" -exec mv {} funkin_vslice_mobile.apk \;
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSlice-Mobile-Final
          path: funkin_vslice_mobile.apk
