# Builds the game for Android with full verbose/debug output.

name: Build Android (Debug)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build-defines:
        type: string
        description: Build defines to use
        default: '-DGITHUB_BUILD'
      save-artifact:
        type: boolean
        description: Save the build artifact to Github Actions
        default: true

jobs:

  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      BUILD_DEFINES: ${{ github.event.inputs.build-defines || '-DGITHUB_BUILD' }}
      GRADLE_OPTS: "-Dorg.gradle.logging.level=debug"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Print system info
        run: |
          echo "====== SYSTEM INFO ======"
          uname -a
          echo "====== CPU ======"
          nproc
          echo "====== MEMORY ======"
          free -h
          echo "====== DISK ======"
          df -h
          echo "====== ENV VARS ======"
          env | sort

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java
        run: |
          echo "====== JAVA VERSION ======"
          java -version
          echo "====== JAVA HOME ======"
          echo $JAVA_HOME

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "====== INSTALLING NDK ======"
          sdkmanager --verbose --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK installed at: $ANDROID_SDK_ROOT/ndk/25.2.9519653"

      - name: Install Android build tools
        run: |
          echo "====== INSTALLING BUILD TOOLS ======"
          sdkmanager --verbose --install "build-tools;34.0.0" "platforms;android-35"
          echo "====== INSTALLED SDK PACKAGES ======"
          sdkmanager --list_installed

      - name: Verify Android SDK
        run: |
          echo "====== ANDROID SDK ROOT ======"
          echo $ANDROID_SDK_ROOT
          echo "====== ANDROID NDK HOME ======"
          echo $ANDROID_NDK_HOME
          echo "====== SDK CONTENTS ======"
          ls -la $ANDROID_SDK_ROOT

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Verify Haxe
        run: |
          echo "====== HAXE VERSION ======"
          haxe --version
          echo "====== HAXELIB VERSION ======"
          haxelib version

      - name: Config haxelib
        run: |
          echo "====== CONFIGURING HAXELIB ======"
          haxelib --never newrepo
          echo "HAXEPATH=$(haxelib config)" >> "$GITHUB_ENV"
          echo "Haxelib path: $(haxelib config)"

      - name: Restore cached Haxe dependencies
        id: cache-hmm
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxe-hmm-${{ runner.os }}-${{ hashFiles('**/hmm.json') }}

      - name: Install Haxe dependencies
        if: ${{ steps.cache-hmm.outputs.cache-hit != 'true' }}
        run: |
          echo "====== INSTALLING HMM DEPENDENCIES ======"
          haxelib --global install hmm
          git config --global advice.detachedHead false
          haxelib --global run hmm install
          echo "====== BUILDING HXCPP TOOLS ======"
          cd .haxelib/hxcpp/git/tools/hxcpp && haxe compile.hxml
          echo "====== INSTALLED HAXELIBS AFTER HMM ======"
          haxelib list

      - name: Restore hxcpp cache
        uses: actions/cache@v4
        with:
          path: ~/.hxcpp
          key: haxe-hxcpp-${{ runner.os }}-android-${{ github.sha }}
          restore-keys: haxe-hxcpp-${{ runner.os }}-android-

      - name: Configure Lime for Android
        run: |
          echo "====== CONFIGURING LIME FOR ANDROID ======"
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          echo "====== LIME CONFIG ======"
          haxelib run lime config

      - name: Populate .env
        run: |
          echo "====== POPULATING .ENV ======"
          touch .env
          grep API_NG_APP_ID .env || echo API_NG_APP_ID=${{ secrets.API_NG_APP_ID }} >> .env
          grep API_NG_ENC_KEY .env || echo API_NG_ENC_KEY=${{ secrets.API_NG_ENC_KEY }} >> .env
          echo ".env populated."

      - name: Print project structure
        run: |
          echo "====== PROJECT STRUCTURE ======"
          ls -la
          echo "====== SOURCE DIR ======"
          ls -la source/ | head -40
          echo "====== ASSETS DIR ======"
          ls -la assets/ | head -40

      - name: Build game (Android)
        run: |
          echo "====== STARTING ANDROID BUILD ======"
          echo "Build defines: $BUILD_DEFINES"
          haxelib run lime build android -v -release --times $BUILD_DEFINES
          echo "====== BUILD COMPLETE ======"
        timeout-minutes: 120

      - name: List build output
        run: |
          echo "====== BUILD OUTPUT ======"
          find export/release/android -type f | sort

      - name: Save APK artifact
        if: ${{ github.event.inputs.save-artifact || true }}
        uses: actions/upload-artifact@v4
        with:
          name: FNFVSlice-android
          path: export/release/android/bin/app/build/outputs/apk/debug/
