name: V-Slice Android Build
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Haxe
        uses: FunkinCrew/ci-haxe@v3
        with:
          haxe-version: 4.3.7

      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3
      
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install Haxelibs
        run: |
          haxelib setup ~/haxelib
          # Pinning stable versions for 0.8.3
          haxelib install lime 8.0.2 --never
          haxelib install openfl 9.2.1 --never
          
          # Use the Funkin' Crew's official library forks
          haxelib git flixel https://github.com/FunkinCrew/flixel.git --never
          haxelib install flixel-addons --never
          haxelib install flixel-ui --never
          haxelib install hxp --never
          
          # This line tells Haxe to grab the 'dev' branch from the Crew's repo
          haxelib git flxanimate https://github.com/FunkinCrew/flxanimate.git dev --never
          haxelib git flxpartialsound https://github.com/FunkinCrew/FlxPartialSound.git --never
          
          # Other mandatory V-Slice dependencies
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis.git --never
          haxelib git hxvlc https://github.com/MAJigsaw77/hxvlc.git --never
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools.git --never
          haxelib install hscript-iris --never
          haxelib install polymod --never
          haxelib install thx.core --never
          haxelib git grig.audio https://github.com/osakared/grig.audio.git --never

      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Final Build
        run: |
          PROJECT_FILE=$(find . -maxdepth 2 -iname "project.xml" -print -quit)
          haxelib run lime build "$PROJECT_FILE" android -final -64 -v

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VSlice-Android-Release
          path: export/android/bin/app/build/outputs/apk/release/*.apk
