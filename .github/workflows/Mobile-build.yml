name: Build FNF VSlice Mobile APK

# Trigger only on pushes to main branch, plus manual workflow trigger
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      NDK_VERSION: r21d

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Init submodules (VERY IMPORTANT)
      - name: Init submodules
        run: git submodule update --init --recursive

      # Setup Haxe
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      # Install Neko
      - name: Install Neko
        run: sudo apt-get update && sudo apt-get install -y neko

      # Setup Java (required for Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 11

      # Setup Android SDK + Build Tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          cmdline-tools-version: latest

      # Set Android env variables (for Lime)
      - name: Set Android environment variables
        run: |
          echo "ANDROID_SDK_ROOT=${{ env.ANDROID_SDK_ROOT }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV
          echo "JAVA_HOME=${{ env.JAVA_HOME }}" >> $GITHUB_ENV

      # Accept Android licenses
      - name: Accept Licenses
        run: yes | ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin/sdkmanager --licenses

      # Setup Android NDK
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      # Setup Funkin patched haxelib + hmm
      - name: Setup HMM
        run: |
          haxelib --global git haxelib https://github.com/FunkinCrew/haxelib.git
          haxelib --global git hmm https://github.com/FunkinCrew/hmm.git
          haxelib --global run hmm setup

      # Install dependencies from hmm.json
      - name: Install dependencies
        run: haxelib run hmm install

      # Setup Lime and Android paths
      - name: Setup Lime
        run: |
          haxelib run lime setup
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME

      # Clean (IMPORTANT for package name changes)
      - name: Clean build
        run: haxelib run lime clean android

      # Rebuild native libraries
      - name: Rebuild hxcpp
        run: haxelib run lime rebuild hxcpp android

      - name: Rebuild extensions
        run: haxelib run lime rebuild extension-androidtools android

      # Build APK
      - name: Build APK
        run: haxelib run lime build android -debug -Dci

      # Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-VSlice-Modded
          path: export/**/apk/*.apk
