name: Build FNF VSlice Mobile APK

# Trigger only on pushes to main branch, plus manual workflow trigger
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: r21d

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Init submodules (VERY IMPORTANT)
      - name: Init submodules
        run: git submodule update --init --recursive

      # Setup Haxe
      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      # Install Neko
      - name: Install Neko
        run: sudo apt-get update && sudo apt-get install -y neko

      # Setup Java (required for Android)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 11

      # FIX 1 & 6: setup-android does NOT accept api-level/build-tools params.
      # Install cmdline-tools only here, then install build-tools via sdkmanager below.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest

      # FIX 6: Explicitly install required build-tools via sdkmanager
      - name: Install Android build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      # FIX 2 & 3: Use $ANDROID_HOME (set by setup-android) instead of a
      # custom path that nothing else knows about. NDK_HOME is set by setup-ndk below.
      - name: Set Android environment variables
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      # Accept Android licenses
      - name: Accept Licenses
        run: yes | sdkmanager --licenses

      # Setup Android NDK — this action exports ANDROID_NDK_HOME automatically
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      # Capture the NDK path that nttld/setup-ndk actually installed to
      - name: Set NDK environment variable
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      # Setup Funkin patched haxelib + hmm
      - name: Setup HMM
        run: |
          haxelib --global git haxelib https://github.com/FunkinCrew/haxelib.git
          haxelib --global git hmm https://github.com/FunkinCrew/hmm.git
          # FIX 4: --global is an install-only flag; run does not accept it
          haxelib run hmm setup

      # Install dependencies from hmm.json
      - name: Install dependencies
        run: haxelib run hmm install

      # Setup Lime and Android paths
      - name: Setup Lime
        run: |
          # FIX 5: Pipe 'y' so the interactive prompt doesn't hang the runner
          echo y | haxelib run lime setup
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME

      # Clean (IMPORTANT for package name changes)
      - name: Clean build
        run: haxelib run lime clean android

      # Rebuild native libraries
      - name: Rebuild hxcpp
        run: haxelib run lime rebuild hxcpp android

      - name: Rebuild extensions
        run: haxelib run lime rebuild extension-androidtools android

      # Build APK
      - name: Build APK
        run: haxelib run lime build android -debug -Dci

      # FIX 7: Correct export path for Funkin debug APK output
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-VSlice-Modded
          path: export/android/bin/app/build/outputs/apk/debug/*.apk
