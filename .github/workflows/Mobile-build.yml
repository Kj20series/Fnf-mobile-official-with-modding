name: V-Slice Mobile (2026 Ultimate Build)
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libusb-1.0-0-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe
        uses: FunkinCrew/ci-haxe@v3
        with:
          haxe-version: 4.3.7

      - name: Install & Compile hxcpp (Tool Fix)
        run: |
          haxelib setup ~/haxelib
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp --never
          cd ~/haxelib/hxcpp/git/tools/hxcpp
          haxe compile.hxml
          cd ${{ github.workspace }}

      - name: Install Global Libraries
        run: |
          haxelib install lime 8.1.2
          haxelib install openfl 9.3.3
          haxelib install flixel 5.5.0
          haxelib install hxp
          
          # Fixed Git Installs (No .git suffix, added --never)
          haxelib git hx-tools https://github.com/FunkinCrew/hx-tools --never
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis --never
          haxelib git extension-webm https://github.com/GrowtopiaFli/extension-webm --never
          haxelib git hxvlc https://github.com/MAJigsaw77/hxvlc --never
          haxelib git extension-androidtools https://github.com/MAJigsaw77/extension-androidtools --never
          
          haxelib run lime setup flixel
          haxelib run lime setup
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install hscript-iris
          haxelib install polymod
          haxelib install thx.core
          haxelib upgrade -y

      - name: Setup Android NDK (r25c)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Patch extension-webm
        run: |
          EXT_PATH=$(haxelib libpath extension-webm | tr -d '\n')
          find "$EXT_PATH" -name "mkvmuxerutil.cpp" -exec sed -i '1i#include <unistd.h>' {} +
          find "$EXT_PATH" -name "mkvwriter.cpp" -exec sed -i '1i#include <unistd.h>' {} +

      - name: Rebuild & Build APK
        run: |
          haxelib run lime rebuild extension-webm android -v7 -64
          haxelib run lime rebuild hxvlc android -v7 -64
          
          # Target project.hxp explicitly
          haxelib run lime build project.hxp android -final -v7 -64 \
          -D"armeabi-v7a" -D"arm64-v8a" \
          -DGITHUB_BUILD \
          -DFEATURE_TOUCH_CONTROLS \
          -DFEATURE_VIDEO_PLAYBACK

      - name: Rename & Upload APK
        run: |
          find export/ -name "*.apk" -exec mv {} funkin_vslice_mobile.apk \;
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSlice-Mobile-Final
          path: funkin_vslice_mobile.apk
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSlice-Mobile-Final
          path: funkin_vslice_mobile.apk
