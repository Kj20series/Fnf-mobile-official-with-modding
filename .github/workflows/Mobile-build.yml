name: V-Slice Mobile (Verified Mirror)
on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Haxe (Reliable Mirror)
        uses: hughsando/setup-haxe@master
        with:
          haxe-version: 4.3.6 # Using the stable V-Slice target

      - name: Install PC Dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install hmm
          haxelib run hmm setup
          haxelib run hmm install
          
          # Verified 2026 Link for WebM (Fixes audio sync)
          haxelib git extension-webm https://github.com/GrowtopiaFli/extension-webm
          
          # Official Funkin Visualization (Crucial for V-Slice)
          haxelib git funkin.vis https://github.com/FunkinCrew/funkVis
          
          # Stable Android Video Support
          haxelib git hxvlc https://github.com/MAJigsaw77/hxvlc.git
          
          haxelib upgrade -y

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Configure Lime
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Rebuild Extensions
        run: |
          haxelib run lime rebuild extension-webm android
          haxelib run lime rebuild hxvlc android

      - name: Compile APK
        run: |
          haxelib run lime build android -final \
          -DAPP_TITLE="Friday Night Funkin': Vslice mobile" \
          -DAPP_PACKAGE="com.Funkin.Mobile"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VSlice-Mobile-Latest
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
