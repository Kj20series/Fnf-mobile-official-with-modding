name: Android Build (V-Slice Ad-Free)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install Haxelibs
        run: |
          haxelib setup ~/haxelib
          haxelib install lime 8.1.2
          haxelib install openfl 9.3.3
          haxelib install flixel 5.5.0
          haxelib install flixel-addons
          haxelib install flixel-ui
          haxelib install flixel-animate
          haxelib git polymod https://github.com/larsiusprime/polymod.git
          haxelib git hxvlc https://github.com/MAJESTY-Development/hxvlc.git
          haxelib git extension-androidtools https://github.com/MAJESTY-Development/extension-androidtools.git
          haxelib install extension-haptics
          haxelib install tjson
          haxelib install hscript
          # NO ADMOB INSTALLATION HERE
          
      - name: Configure Lime Android
        run: |
          haxelib run lime setup android $ANDROID_SDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime setup

      - name: Prepare Keystore (from Secrets)
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 -d > keystore.jks
          echo "KEYSTORE_PATH=keystore.jks" > .env
          echo "KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }}" >> .env
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> .env
        # This matches the envConfig check in your Project.hx

      - name: Build Android APK
        run: haxelib run lime build android -release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FNF-Android-Release
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
