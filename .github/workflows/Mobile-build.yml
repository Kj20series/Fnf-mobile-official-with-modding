name: Build FNF VSlice Mobile APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # CHANGED: Updated NDK to a version that actually supports modern V-Slice C++
      NDK_VERSION: 25.2.9519653

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y neko libasound2-dev libpulse-dev libx11-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev libglu1-mesa-dev g++-multilib gcc-multilib

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Set Android Environment Variables
        run: |
          # Use the pre-installed SDK path on GitHub Runners
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Setup HMM & Haxelib
        run: |
          # Using the Crew's versions as your script intended
          haxelib --global git haxelib https://github.com/FunkinCrew/haxelib.git
          haxelib --global git hmm https://github.com/FunkinCrew/hmm.git
          haxelib run hmm setup
          haxelib run hmm install

      - name: Bootstrap hxcpp
        run: |
          # This ensures the C++ compiler toolchain is actually compiled
          HXCPP_PATH=$(haxelib libpath hxcpp)
          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Configure Lime for Android
        run: |
          # We force-set these so Lime doesn't ask questions during the build
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          # Rebuild lime for the host and target
          haxelib run lime rebuild lime linux
          haxelib run lime rebuild lime android

      - name: Clean and Build APK
        run: |
          # Use -debug as your original script had, but added -Dci for better logs
          haxelib run lime clean android
          haxelib run lime build android -debug -Dci

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-VSlice-Android-Debug
          path: export/release/android/bin/app/build/outputs/apk/debug/*.apk
