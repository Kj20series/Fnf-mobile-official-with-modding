name: Build FNF VSlice Mobile APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: r21d

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init submodules
        run: git submodule update --init --recursive

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            neko \
            libasound2-dev \
            libpulse-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            g++-multilib \
            gcc-multilib

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set Android SDK environment variables
        run: |
          ANDROID_SDK="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_SDK"             >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK"         >> $GITHUB_ENV
          echo "$ANDROID_SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK/platform-tools"           >> $GITHUB_PATH
          echo "JAVA_HOME=$JAVA_HOME"                  >> $GITHUB_ENV

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Install Android build tools and platform
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}

      - name: Set NDK environment variable
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Setup HMM
        run: |
          haxelib --global git haxelib https://github.com/FunkinCrew/haxelib.git
          haxelib --global git hmm https://github.com/FunkinCrew/hmm.git
          haxelib run hmm setup

      - name: Install dependencies
        run: haxelib run hmm install

      # We keep this because it compiles the 'hxcpp' compiler tool itself
      - name: Bootstrap hxcpp
        run: |
          HXCPP_PATH=$(haxelib path hxcpp | head -1)
          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Setup Lime
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          printf "n\ny\n" | haxelib run lime setup
          printf "y\n" | haxelib run lime setup android

      # We removed 'rebuild lime linux', 'rebuild hxcpp android', and 'rebuild extensions'
      # to see if 'lime build android' can handle them automatically.

      - name: Build APK
        run: haxelib run lime build android -debug -Dci

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FNF-VSlice-Modded
          path: export/android/bin/app/build/outputs/apk/debug/*.apk
