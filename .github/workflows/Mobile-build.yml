name: Build FNF V-SLICE Android
on: [push, pull_request, workflow_dispatch]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6
      - uses: actions/cache@v4
        with:
          path: ~/.haxelib
          key: ${{ runner.os }}-haxelib
      - uses: android-actions/setup-android@v3
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
      - name: Setup Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev libsdl2-dev libsdl2-2.0-0
      - name: Setup Haxelib
        run: |
          haxelib --global install hmm
          haxelib --global run hmm setup
          hmm install
      - name: Setup Lime
        run: haxelib run lime setup
      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_ROOT
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
      - name: Build APK
        run: haxelib run lime build android -final -DGITHUB_BUILD
        timeout-minutes: 180
      - uses: actions/upload-artifact@v4
        with:
          name: FNF-VSLICE-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          retention-days: 90
